name: Nasadit na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Načíst zdrojový kód
        uses: actions/checkout@v6

      - name: Připravit Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Nainstalovat závislosti
        run: npm ci

      - name: Sestavit statickou aplikaci
        run: npm run build:pages

      - name: Připravit GitHub Pages
        uses: actions/configure-pages@v6

      - name: Nahrát statickou aplikaci
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Nasadit GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
